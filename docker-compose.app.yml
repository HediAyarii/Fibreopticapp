version: '3.8'

services:
  finalfibre-app:
    build: .
    container_name: finalfibre-app
    ports:
      - "3000:3000"
    environment:
      # Configuration de la base de données
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=finalfibre_db
      - DB_USER=finalfibre_user
      - DB_PASSWORD=finalfibre_password_2024
      
      # Configuration de l'application
      - NODE_ENV=production
      - PORT=3000
      
      # Variables Python (si nécessaire)
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
    networks:
      - finalfibre-network
    restart: unless-stopped
    volumes:
      # Volume pour les logs
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/sections"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: finalfibre-postgres
    environment:
      - POSTGRES_DB=finalfibre_db
      - POSTGRES_USER=finalfibre_user
      - POSTGRES_PASSWORD=finalfibre_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - finalfibre-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalfibre_user -d finalfibre_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local

networks:
  finalfibre-network:
    driver: bridge
