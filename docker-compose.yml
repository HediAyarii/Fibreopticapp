services:
  postgres:
    image: postgres:15-alpine
    container_name: finalfibre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finalfibre_db
      POSTGRES_USER: finalfibre_user
      POSTGRES_PASSWORD: finalfibre_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create_database_schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - finalfibre-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalfibre_user -d finalfibre_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finalfibre-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finalfibre.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - finalfibre-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  finalfibre-network:
    driver: bridge
